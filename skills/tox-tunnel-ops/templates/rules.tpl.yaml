# ToxTunnel Access Control Rules
# Generated by tox-tunnel-ops skill
#
# Each rule binds to a specific friend's 64-character hex public key.
# Wildcards are NOT supported for friend identity.
#
# Evaluation order:
#   1. Find the rule matching the friend's public key (exact match)
#   2. Check deny rules first (deny takes precedence)
#   3. Check allow rules
#   4. No match → default deny
#
# Host patterns: a single "*" wildcard (one prefix + one suffix) is supported,
# e.g. "*.example.com", "192.168.*". Multi-segment patterns like
# "192.168.*.*" will NOT match — use "192.168.*".
# Ports: list specific ports, or use empty list [] to mean "all ports"
#
# ############################################################################
# # THE PARSER FAILS OPEN. Three behaviours that all WIDEN access:           #
# ############################################################################
#  1. Unknown keys inside an allow/deny entry are SILENTLY IGNORED. The
#     decoder reads `host` and `ports` by name and never enumerates keys.
#  2. A MISSING `ports` key means ALL PORTS. Combine 1 and 2 and a `port: 22`
#     typo (singular) parses as "allow every port on that host", with no
#     warning anywhere.
#  3. DUPLICATE `friend:` entries are not merged — lookup is a linear
#     first-match, so a second block for the same key is dead config.
#
# And nothing validates this file until the daemon loads it:
# `toxtunnel config check --strict` validates the main config ONLY and never
# opens rules_file. Use `bash scripts/diagnose.sh <server.yaml>` instead — it
# checks all three of the above.
#
# So, when filling this in:
#   * use ONLY `host` and `ports` inside an allow/deny entry;
#   * give every allow entry an EXPLICIT, NON-EMPTY `ports:` list, unless all
#     ports were deliberately requested (then write `ports: []` and say so);
#   * list each friend public key EXACTLY ONCE.
#
# Template variables:
#   {{FRIEND_PK}}    — 64-char hex public key (required; the FIRST 64 chars of
#                      the peer's 76-char Tox ID, not the whole ID)
#   {{FRIEND_LABEL}} — comment label for the friend (optional, human-readable)
#   {{HOST}}         — target hostname or IP pattern
#   {{PORTS}}        — YAML list: [22, 80, 443] for specific ports, or [] for all ports
#
# Reference this file from server.yaml with an ABSOLUTE path. A relative
# rules_file resolves against the daemon's working directory, not the config's
# directory, so "put it next to server.yaml" is not sufficient:
#   server:
#     rules_file: /etc/toxtunnel/rules.yaml
#
# v0.4: anti-DoS rate-limit defaults — the baseline for every friend.
# Uncomment to enable. Start in `report` (as written below) to size the limits
# against real traffic, then flip to `mode: enforce`.
#
# rate_limit_defaults:
#   mode: report                  # measure first; change to `enforce` when tuned
#   open_per_sec: 10
#   open_burst: 50
#   max_concurrent_tunnels: 100
#   bytes_per_sec: 1048576        # 1 MiB/s of inbound TUNNEL_DATA from a friend
#   bytes_burst: 4194304          # bucket capacity; BOTH keys must be non-zero
#
# About the byte budget (implemented since v0.4.11 — earlier releases parsed
# these keys and did nothing with them, so check the value before upgrading
# into it):
#
#   * Direction: it meters the payload a friend pushes AT this server, per
#     friend, summed across that friend's tunnels — the same direction
#     `open_per_sec` guards. It does NOT limit what this server sends back.
#   * `enforce` never drops a frame and never closes a tunnel. Over-budget
#     frames are deferred and replayed in arrival order; withholding their
#     TUNNEL_ACK closes the peer's send window, so the throttle propagates
#     back to the origin TCP socket instead of piling up here.
#   * `report` accounts and moves toxtunnel_rate_limit_bytes_throttled_total
#     without delaying anything. Size the limit here first.
#   * Limitation to be honest about: a receiver-side deferral cannot hold an
#     average rate against a peer that ignores flow control — against one it
#     degrades to bursts capped by a 32 MiB per-friend memory rail (logged at
#     warn when hit). This is a bandwidth budget for cooperative peers, not a
#     defence against a hostile one. `max_concurrent_tunnels` / `open_per_sec`
#     remain the anti-DoS knobs.
#   * `bytes_burst: 0` is how you exempt a friend; a non-zero value below
#     65535 is raised to 65535.

rules:
{{#RULES}}
  - friend: "{{FRIEND_PK}}"    # {{FRIEND_LABEL}}
    # v0.4: optional per-friend rate-limit override. Only the fields you name
    # are overridden; everything else (mode included) is inherited from
    # rate_limit_defaults above.
    # rate_limit:
    #   max_concurrent_tunnels: 200
    #   bytes_per_sec: 262144        # 256 KiB/s inbound for this friend only
    #   bytes_burst: 1048576
    # Only `host` and `ports` are recognised here. `ports` is REQUIRED in
    # practice: omit it and the entry silently means every port on that host.
    allow:
{{#ALLOW}}
      - host: "{{HOST}}"
        ports: {{PORTS}}
{{/ALLOW}}
{{#DENY}}
    deny:
      - host: "{{HOST}}"
        ports: {{PORTS}}
{{/DENY}}
{{/RULES}}
