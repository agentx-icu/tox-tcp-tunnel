# ToxTunnel Server Configuration
# Generated by tox-tunnel-ops skill
#
# Usage: toxtunnel -m server -c server.yaml
# After starting, note the Tox ID printed in the log — the client needs it.
#
# Validate before starting:  toxtunnel config check -c server.yaml --strict
# NOTE: config check does NOT open or validate server.rules_file. A config
# pointing at a missing or malformed rules file still reports "is valid" and
# then fails at daemon startup. Run `bash scripts/diagnose.sh server.yaml`
# to check the rules file too.

mode: server

# Directory for MUTABLE daemon state: the Tox identity (tox_save.dat), the pid
# file, the data-directory lock, the inspect socket, known_servers.yaml.
# Use an ABSOLUTE path, and NOT a subdirectory of /etc — /etc is for config.
#   Linux (system service): /var/lib/toxtunnel     <- what the packaged unit uses
#   macOS (system daemon):  /usr/local/var/toxtunnel
#   Linux/macOS (user):     ~/.config/toxtunnel/server
#   Windows:                %APPDATA%\toxtunnel\server  (service: C:\ProgramData\ToxTunnel\data)
# Run the daemon as a dedicated unprivileged account that owns this directory,
# not as root. Since v0.4.11 the daemon takes an exclusive lock on it, so no two
# daemons may share one data_dir.
data_dir: {{DATA_DIR}}

# Service / daemon policy when run under `--service` (systemd, launchd, SCM).
# Server defaults to "online" — packaged installs come up reachable. Flip
# auto_start: false to ship a server install that idles until manually enabled.
# service:
#   auto_start: true            # server installs default to online
#   allow_client_daemon: false  # ignored in server mode

logging:
  level: {{LOG_LEVEL|info}}
  # file: /var/log/toxtunnel/server.log   # uncomment for file logging

# Prometheus /metrics endpoint (opt-in). Off by default.
# KEEP the listen address on loopback unless the scraper is on a trusted
# network — Prometheus exposition has no built-in auth.
# metrics:
#   enabled: false
#   listen: 127.0.0.1:9100
#   path: /metrics

# Local IPC for `toxtunnel inspect` (read-only, never network-exposed).
# Default-on; set enabled: false to disable.
# inspect:
#   enabled: true

# Tunnel data-path tunables. Defaults are sane for most users.
# tunnel:
#   coalesce_max_delay_us: 200    # default-on small-write coalescing
#   coalesce_max_bytes: 1362      # ≤ Tox 1367-byte frame limit
#   coalesce_mode: fixed          # v0.4: fixed (default) | adaptive | bypass | drain
#   keepalive_interval_seconds: 0 # v0.4: 0=off; >0 sends PING/PONG every Ns,
#                                 # declares peer dead after 3× of no PONG.
#   half_close_timeout_seconds: 120
#                                 # DEFAULT-ON. Force-closes a tunnel left in
#                                 # Disconnecting (peer never sent its
#                                 # reciprocal TUNNEL_CLOSE) after this long
#                                 # idle. This is what handles half-closed
#                                 # "zombie" tunnels — lower it if they linger.
#                                 # 0 disables.
#   idle_timeout_seconds: 0       # 0 = disabled (default). Opt-in, and DISTINCT
#                                 # from the half-close cap above: it reaps ANY
#                                 # non-Connecting tunnel purely on inactivity,
#                                 # so it will also kill a legitimately quiet
#                                 # SSH session or an idle DB pool. Enable it
#                                 # only after confirming with
#                                 # `toxtunnel inspect tunnels` that the stuck
#                                 # tunnels are Connected, not Disconnecting.
#   reaper_tick_seconds: 10       # shared wake-up interval for both policies
#   resume:                       # v0.4: tunnel fast-reattach (opt-in)
#     enabled: false              # opcodes wire-inactive when false
#     max_age_seconds: 300        # how long this server holds a disconnected
#                                 # friend's IN-MEMORY tunnels (and their target
#                                 # TCP connections) waiting for a reconnect.
#                                 # Nothing is written to disk; resume cannot
#                                 # survive a process restart on either side.
#     on_gap: passthrough         # passthrough | close

# v0.4 stability + performance blocks. Defaults preserve v0.3.0 semantics
# EXCEPT flow_control.mode, which defaults to `bdp` since v0.4.1.
# watchdog:
#   enabled: true                 # in-process tox-thread wedge detector
#   deadline_seconds: 30          # std::abort() if heartbeat stalls past this
#   systemd_notify: true          # sd_notify(WATCHDOG=1) on Linux only
# flow_control:
#   mode: bdp                     # bdp (default since v0.4.1) | fixed (v0.3.0 cadence)
#   send_window_min_bytes: 65536  # 64 KiB clamp floor (bdp mode)
#   send_window_max_bytes: 4194304   # 4 MiB clamp ceiling (bdp mode)
#   safety_factor_x100: 150       # 1.5× BDP headroom
#   fixed_window_bytes: 262144    # 256 KiB — used in fixed mode

tox:
  udp_enabled: true
  tcp_port: {{TCP_PORT|33445}}
  # auto: connect via public DHT nodes (requires internet)
  # lan:  LAN-only discovery (no internet needed, both machines must be on same subnet)
  bootstrap_mode: {{BOOTSTRAP_MODE|auto}}
  # Manual bootstrap nodes (only needed for air-gapped or custom setups):
  # bootstrap_nodes:
  #   - address: 198.199.98.108
  #     port: 33445
  #     public_key: <64-hex-chars>

{{#RULES_FILE}}
server:
  # MUST be an absolute path. ToxTunnel expands `~` and nothing else, then hands
  # the string straight to the rules loader, so a relative path resolves against
  # the DAEMON's working directory — not this file's directory. Under systemd or
  # launchd that is somewhere you did not choose, and startup dies with
  # "Failed to load rules file: Rules file not found".
  rules_file: {{RULES_FILE}}
  # System-info disclosure to clients via INFO_REQUEST/INFO_REPLY.
  # Defaults are all false (server discloses nothing). Opt in per field if
  # operators of connecting clients should be able to see this metadata.
  # disclose:
  #   hostname: false
  #   os: false
  #   os_version: false
  #   arch: false
  #   uptime: false
  #   toxtunnel_version: false
{{/RULES_FILE}}
{{^RULES_FILE}}
# Access control rules (REQUIRED for any real deployment — with no rules_file
# the server is default-deny and refuses every friend request).
# Use an ABSOLUTE path: a relative one resolves against the daemon's working
# directory, not this file's directory.
# server:
#   rules_file: /etc/toxtunnel/rules.yaml
#   disclose:
#     hostname: false
#     os: false
#     os_version: false
#     arch: false
#     uptime: false
#     toxtunnel_version: false
{{/RULES_FILE}}
