# ToxTunnel Client Configuration
# Generated by tox-tunnel-ops skill
#
# Usage: toxtunnel -m client -c client.yaml
#
# Validate before starting:  toxtunnel config check -c client.yaml --strict
# (v0.4.13+ resolves known-servers aliases. On v0.4.12 and older an alias-form
#  server_id fails it with "Server ID must be 76 characters" even when the alias
#  is registered and the daemon starts fine — every other finding is real.)

mode: client

# Directory for Tox identity (tox_save.dat) and bootstrap cache
# macOS:  ~/Library/Application Support/toxtunnel/client
# Linux:  ~/.config/toxtunnel/client
# Windows: %APPDATA%\toxtunnel\client
data_dir: {{DATA_DIR}}

# Service policy when this config is run under `--service` (systemd, launchd, SCM).
# Client installs default to "idle" so a packaged daemon never silently binds
# local forward ports on a desktop. Flip allow_client_daemon: true once forwards
# are configured below.
# service:
#   auto_start: false           # ignored in client mode
#   allow_client_daemon: false  # set true to actually bind local ports under --service

logging:
  level: {{LOG_LEVEL|info}}
  # file: /var/log/toxtunnel/client.log   # uncomment for file logging

tox:
  udp_enabled: true
  bootstrap_mode: {{BOOTSTRAP_MODE|auto}}

# Prometheus /metrics endpoint (opt-in). Off by default.
# The client exposes its own metric set (tunnels_active{role="client"},
# friends_online, bytes_in/out, etc.). KEEP loopback unless scraper is trusted.
# metrics:
#   enabled: false
#   listen: 127.0.0.1:9100
#   path: /metrics

# Local IPC for `toxtunnel inspect` (read-only, default-on).
# inspect:
#   enabled: true

# Tunnel data-path tunables (defaults are fine for most users).
# tunnel:
#   coalesce_max_delay_us: 200
#   coalesce_max_bytes: 1362
#   idle_timeout_seconds: 0       # 0 = disabled; set non-zero to reap idle tunnels

client:
  # Either paste the server's 76-character Tox ID here, or use an alias that
  # has been registered with `toxtunnel servers add <alias> <tox_id>`. Aliases
  # resolve from <data_dir>/known_servers.yaml at startup.
  # You can find a literal Tox ID in the server's startup log output, or via
  # `toxtunnel print-id --data-dir <server_data_dir>` on the server side.
  server_id: {{SERVER_ID|<PASTE_SERVER_TOX_ID_HERE>}}
  # --- OR use a list for multi-server failover ---
  # The first entry is the preferred primary; remaining entries are tried in
  # order when the active server stays offline past failover.timeout_seconds.
  # server_id:
  #   - primary-homelab
  #   - hetzner-fallback
  #   - <full-76-char-tox-id>

  # --- OR keep server_id a scalar and list the fallbacks separately ---
  # Both spellings are accepted and are ADDITIVE (a list server_id plus this
  # key gives primary = entry 0, fallbacks = the rest plus these).
  # fallback_server_ids:
  #   - hetzner-fallback
  #   - <full-76-char-tox-id>

  # Multi-server failover policy. Applies whenever more than one server ID
  # resolves: a list server_id, fallback_server_ids, or --server-id-fallback.
  #
  # NOTE: failover does NOT preserve sessions. On switchover the client closes
  # every tunnel on the old server, so established TCP connections die and the
  # application must reconnect. It keeps the service reachable, not the session.
  # failover:
  #   timeout_seconds: 60                  # primary offline this long -> promote next online candidate
  #   prefer_primary_grace_seconds: 30     # primary must be online this long before we switch back

  # SOCKS5 / HTTP CONNECT listener for dynamic destinations.
  # Off by default. Listen address MUST be loopback (127.0.0.1, ::1, localhost)
  # — the config validator rejects non-loopback binds. The server-side
  # rules.yaml still enforces which destinations are reachable.
  # Mutually exclusive with `pipe` below.
  # socks5:
  #   enabled: false
  #   listen: 127.0.0.1:1080

  # Port forwarding rules: local_port on this machine → remote_host:remote_port
  # on the server side.
  #
  # ############################################################################
  # # WARNING: without local_address a forward binds 0.0.0.0 — EVERY IPv4      #
  # # INTERFACE, not loopback.                                                 #
  # ############################################################################
  # v0.4.13+ : set `local_address: 127.0.0.1` (as below) unless the forward is
  # genuinely meant to serve other machines. The daemon warns at startup when
  # the key is absent and the bind is not loopback; writing `0.0.0.0`
  # explicitly is supported and silences that warning.
  #
  # v0.4.12 and older: there is NO such key. ForwardRule has exactly three
  # fields and the client constructs TcpListener(io, local_port), which binds
  # asio::ip::tcp::v4(). Writing local_address there is flagged by
  # `config check --strict` as an unknown key and the port still answers on
  # every interface — use a host firewall rule or a loopback SOCKS5 listener
  # instead. Check the daemon version before choosing.
  #
  # So on any shared network — office LAN, café Wi-Fi, a cloud VPC — every host
  # that can reach this machine reaches the forwarded service, with only that
  # service's own authentication in front of it. Mitigate with EITHER:
  #
  #   1. A host firewall rule limiting the port to loopback:
  #        nft add rule inet filter input tcp dport <PORT> iif != lo drop
  #        ufw deny in to any port <PORT>
  #        pf:  block in proto tcp to any port <PORT>
  #        PS:  New-NetFirewallRule -DisplayName "block toxtunnel <PORT>" `
  #               -Direction Inbound -LocalPort <PORT> -Protocol TCP -Action Block
  #   2. The SOCKS5 listener above instead of a static forward — its `listen`
  #      IS validated to be loopback, so it cannot leak this way.
  #
  # If FORWARDS is empty, delete the `forwards:` key entirely rather than
  # leaving it with no value (a bare key parses as null).
  forwards:
{{#FORWARDS}}
    - local_port: {{LOCAL_PORT}}
      # Drop this line only for a forward that must serve other machines
      # (and only on v0.4.13+, where the key exists at all).
      local_address: 127.0.0.1
      remote_host: {{REMOTE_HOST}}
      remote_port: {{REMOTE_PORT}}
{{/FORWARDS}}

{{#PIPE_TARGET}}
  # Pipe mode (alternative to forwards, used with SSH ProxyCommand).
  # NOTE: pipe and socks5 cannot be enabled at the same time.
  pipe:
    remote_host: {{PIPE_REMOTE_HOST}}
    remote_port: {{PIPE_REMOTE_PORT}}
{{/PIPE_TARGET}}
{{^PIPE_TARGET}}
  # Pipe mode (uncomment for SSH ProxyCommand usage; POSIX only):
  # pipe:
  #   remote_host: 127.0.0.1
  #   remote_port: 22
{{/PIPE_TARGET}}
